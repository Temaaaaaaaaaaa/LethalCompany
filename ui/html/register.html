{{define "content"}}

    <link rel="stylesheet" href="/static/css/auth.css">

    <div class="auth-container">

        <div class="auth-card">
            <h2 class="text-warning text-center mb-4">
                🧬 Регистрация
            </h2>
            <form method="POST" action="/register">
                <div class="mb-3">
                    <label class="form-label text-secondary">
                        Имя пользователя
                    </label>
                    <input type="text"
                           name="username"
                           class="form-control auth-input"
                           required>
                </div>
                <div class="mb-3">
                    <label class="form-label text-secondary">
                        Логин
                    </label>
                    <input type="text"
                           name="login"
                           class="form-control auth-input"
                           required>
                </div>
                <div class="mb-3">
                    <label class="form-label text-secondary">
                        Пароль
                    </label>
                    <input type="password"
                           name="password"
                           class="form-control auth-input"
                           required>
                </div>
                <div class="mb-4">
                    <label class="form-label text-secondary">
                        Подтверждение пароля
                    </label>
                    <input type="password"
                           name="confirm_password"
                           class="form-control auth-input"
                           required>
                </div>
                <button type="submit"
                        class="btn btn-warning w-100 fw-bold">
                    Зарегистрироваться
                </button>
            </form>
            <hr class="border-warning opacity-25 my-4">
            <p class="text-center text-secondary mb-0">
                Уже есть аккаунт?
                <a href="/login"
                   class="text-warning text-decoration-none">
                    Войти
                </a>
            </p>
        </div>
    </div>
{{end}}
