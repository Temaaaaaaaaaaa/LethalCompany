{{define "content"}}

    <div class="page-header text-center mb-5">
        <h1 class="text-warning fw-bold">
            🧩 Добавить мод
        </h1>
    </div>
    <div class="glass-block p-4">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label text-secondary">
                    Название мода
                </label>
                <input type="text"
                       name="name"
                       class="form-control auth-input"
                       placeholder="например: Better Monsters"
                       required>
            </div>
            <div class="mb-4">
                <label class="form-label text-secondary">
                    Описание
                </label>
                <textarea name="description"
                          rows="5"
                          class="form-control auth-input"
                          placeholder="краткое описание мода..."
                          required></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label text-warning mb-2">
                    📦 Выберите версии сборок
                </label>
                <div class="glass-block p-3">
                    {{range .ModPacks}}
                        <div class="form-check mb-2">
                            <input class="form-check-input"
                                   type="checkbox"
                                   name="modpack_ids"
                                   value="{{.ID}}"
                                   id="mp{{.ID}}">
                            <label class="form-check-label text-light"
                                   for="mp{{.ID}}">
                        <span class="text-warning">
                            {{.Version}}
                        </span>
                                <span class="text-secondary">
                            ({{.GameVersion}})
                        </span>
                            </label>
                        </div>
                    {{else}}
                        <p class="text-secondary mb-0">
                            Пока нет сборок для выбора
                        </p>
                    {{end}}
                </div>
            </div>
            <button type="submit"
                    class="btn btn-warning w-100 fw-bold">
                ➕ Добавить мод
            </button>
        </form>
    </div>
{{end}}
